<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escaner Tinto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: black; }
        .result-card { display: none; margin-top: 20px; }
        .loading { display: none; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 500px;">
    <h3 class="text-center mb-4">Control Tinto</h3> 

    <div class="card mb-3">
        <div class="card-body">
            <label class="form-label">Código de Usuario</label>
            <input type="password" id="usuario" class="form-control mb-3" placeholder="Ej: 1234" value="">
            
            <label class="form-label">Partida / Código QR</label>
            <div class="input-group mb-3">
                <input type="text" id="partida" class="form-control" placeholder="Escanea o escribe">
                <button class="btn btn-outline-secondary" type="button" onclick="startScanner()">📷 Scan</button>
            </div>

            <button class="btn btn-primary w-100" onclick="enviarDatos()">Consultar</button>
        </div>
    </div>

    <div id="reader-container" style="display:none;" class="mb-3">
        <div id="reader"></div>
        <button class="btn btn-danger w-100 mt-2" onclick="stopScanner()">Cerrar Cámara</button>
    </div>

    <div id="loading" class="loading">
        <div class="spinner-border text-primary" role="status"></div>
        <p>Consultando base de datos...</p>
    </div>

    <div id="result-area" class="mt-4"></div>

</div>

<script>
    // --- CONFIGURACIÓN ---
    // URL DEL WEBHOOK DE N8N
    const N8N_WEBHOOK_URL = "https://n8n-n8n.eqegkr.easypanel.host/webhook/taller-control"; 
  
    let html5QrCode;

    function startScanner() {
        document.getElementById('reader-container').style.display = 'block';
        
        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        
        html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
            // Éxito al leer
            document.getElementById('partida').value = decodedText;
            stopScanner();
        }).catch(err => {
            alert("Error al abrir cámara: " + err);
        });
    }

    function stopScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader-container').style.display = 'none';
                html5QrCode.clear();
            });
        }
    }

    async function enviarDatos() {
        const usuario = document.getElementById('usuario').value;
        const partida = document.getElementById('partida').value;
        const resultArea = document.getElementById('result-area');
        const loading = document.getElementById('loading');

        if(!usuario || !partida) {
            alert("Por favor ingresa usuario y partida");
            return;
        }

        // Mostrar carga
        loading.style.display = 'block';
        resultArea.innerHTML = '';

        try {
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'consultar',
                    usuario: usuario, 
                    partida: partida 
                })
            });

            const data = await response.json();
            
            if (data.html) {
                resultArea.innerHTML = data.html;
            } else {
                resultArea.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }

        } catch (error) {
            resultArea.innerHTML = `<div class="alert alert-danger">Error de conexión: ${error.message}</div>`;
        } finally {
            loading.style.display = 'none';
        }
    }

    async function cerrarProceso(rutaId, procesoId) {
        const usuario = document.getElementById('usuario').value;
        const partida = document.getElementById('partida').value;
        
        if (!confirm("¿Seguro que deseas cerrar este proceso?")) return;

        // Mostrar carga visual
        const btn = event.target; 
        const textoOriginal = btn.innerText;
        btn.innerText = "Cerrando...";
        btn.disabled = true;

        try {
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'cerrar',
                    usuario: usuario,
                    partida: partida,
                    rutaId: rutaId,
                    procesoId: procesoId
                })
            });

            const data = await response.json();
            
            if (data.html) {
                 alert("Proceso cerrado correctamente");
                 enviarDatos(); // Recarga la tabla con el PIN actual antes de borrarlo
                 
                 // --- AGREGAR ESTA LÍNEA AQUÍ ---
                 document.getElementById('usuario').value = ""; 
                 // -------------------------------
                    
            } else {
                alert("Error al cerrar: " + JSON.stringify(data));
                btn.innerText = textoOriginal;
                btn.disabled = false;
            }

        } catch (error) {
            alert("Error de conexión: " + error.message);
            btn.innerText = textoOriginal;
            btn.disabled = false;
        }
    }

    // --- NUEVA FUNCIÓN PARA SUPERVISORES ---
    async function revertirProceso(rutaId, procesoId) {
        const usuario = document.getElementById('usuario').value;
        const partida = document.getElementById('partida').value;
        
        if (!confirm("⚠️ ¿Seguro que deseas REABRIR (revertir) este proceso?")) return;

        // Mostrar carga visual
        const btn = event.target; 
        const textoOriginal = btn.innerHTML; // Guardamos ícono original
        btn.innerText = "⏳";
        btn.disabled = true;

        try {
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'revertir',   // Acción para el router
                    usuario: usuario,
                    partida: partida,
                    rutaId: rutaId,
                    procesoId: procesoId
                })
            });

            const data = await response.json();
            
            if (data.html) {
                 alert("Proceso reabierto correctamente");
                 enviarDatos(); // Recarga la tabla
                 
                 // --- AGREGAR ESTA LÍNEA AQUÍ ---
                 document.getElementById('usuario').value = "";
                 // -------------------------------
            } else {
                alert("Error al revertir: " + JSON.stringify(data));
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
            }

        } catch (error) {
            alert("Error de conexión: " + error.message);
            btn.innerHTML = textoOriginal;
            btn.disabled = false;
        }
    }
    
</script>

</body>
</html>
